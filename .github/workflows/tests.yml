name: Tests

on:
  push:
    branches: [ master, portal ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', db: 'mariadb:10.6' }
          - { php: '8.3', db: 'mariadb:11' }
          - { php: '8.4', db: 'mysql:8.4' }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, mbstring, dom, simplexml, xmlwriter
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        env:
          FFS2_TEST_DB_HOST: 127.0.0.1
          FFS2_TEST_DB_USER: root
          FFS2_TEST_DB_PASS: root
        run: php tests/run.php
